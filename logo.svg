<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <!-- Construction hard hat icon -->
  <g transform="translate(5, 10)">
    <!-- Hat body -->
    <path d="M 25 15 Q 25 5, 35 5 Q 45 5, 45 15 L 47 25 L 23 25 Z" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
    <!-- Hat brim -->
    <ellipse cx="35" cy="25" rx="14" ry="3" fill="#e67e22"/>
    <!-- Hat detail line -->
    <line x1="30" y1="12" x2="40" y2="12" stroke="#fff" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Company name -->
  <text x="60" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    BROGAR
  </text>
  <text x="60" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f39c12" letter-spacing="2">
    CONSTRUCTION
  </text>
</svg>
